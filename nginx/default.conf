server {
    listen 80;
    server_name _;

    client_max_body_size 12m;   # document upload (10MB) / audio upload

    # Same-origin REST API: Vue calls /api/v1/*, forwarded to the Java backend
    location /api/ {
        proxy_pass http://backend:8080;
        # Keep the port (e.g. localhost:8088): the backend compares Origin with Host,
        # and a missing port makes same-origin browser requests look cross-origin (403).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vue.js build output (SPA fallback)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
