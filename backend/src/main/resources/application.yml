server:
  port: 8080

spring:
  config:
    # 로컬 실행(bootRun, 작업 폴더 backend/)에서 루트 .env를 읽는다. Docker에서는 compose가 환경변수로 넣는다.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/frangizer}
    username: ${DB_USERNAME:frangizer}
    password: ${DB_PASSWORD:}
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:frangizer}
    audience: ${JWT_AUDIENCE:frangizer-api}
    ttl-seconds: 3600
  internal-token: ${INTERNAL_TOKEN}
  rag-url: ${RAG_URL:http://rag:8001}
  voice-url: ${VOICE_URL:http://voice:8008}
  index-dir: ${FAISS_DIR:/var/lib/frangizer/faiss}   # RAG 색인 산출물(공유 볼륨). 판본 상세의 sections를 읽는다
  # 쉼표 구분. 개발 시 Vite 주소, 배포(Nginx 동일 출처)에서는 비워도 된다.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  document-store-dir: ${DOCUMENT_STORE_DIR:/var/lib/frangizer}
  # 비어 있으면 시연 계정 비밀번호를 설정하지 않는다(로그인 불가)
  demo-password: ${DEMO_PASSWORD:}
