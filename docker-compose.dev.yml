# Local development only: publishes internal ports on 127.0.0.1 for direct access.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Never use this file for the demo / deployment stack.

services:
  db:
    ports:
      - "127.0.0.1:3306:3306"
  backend:
    ports:
      - "127.0.0.1:8080:8080"   # http://localhost:8080/api/v1
  rag:
    ports:
      - "127.0.0.1:8001:8001"
  voice:
    ports:
      - "127.0.0.1:8008:8008"
