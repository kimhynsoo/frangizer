openapi: 3.1.0
info:
  title: 가맹파트너 AI 공개 API
  version: 1.0.0
  description: 2026-10-23 개발 계약. 서버 구현 완료를 뜻하지 않는다. 규범적 동작은 API_명세서.md 참조.
servers:
- url: http://localhost:8080/api/v1
  description: Java 개발 서버
- url: /api/v1
  description: Nginx 동일 출처 배포
security:
- BearerAuth: []
paths:
  /login:
    post:
      operationId: login
      summary: 로그인·JWT 발급
      tags:
      - 인증
      description: 로그인·JWT 발급
      parameters: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: DEMO_TOKEN_REPLACE_WITH_REAL_JWT
                token_type: Bearer
                expires_in: 3600
                user:
                  id: user-demo-01
                  username: demo-owner-a001
                  role: owner
                  brand_id: brand-demo-a
                  store_id: demo-store-01
                  region_code: SEOUL
                  permissions:
                  - rag:ask
                request_id: req-login-001
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-phase: MVP
      x-owner: backend
      x-roles: []
      x-permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /me:
    get:
      operationId: getMe
      summary: 현재 사용자·역할·권한
      tags:
      - 인증
      description: 현재 사용자·역할·권한
      parameters: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  request_id: &id001
                    type: string
                    description: 서버 발급 불투명 식별자
                    minLength: 1
                    maxLength: 100
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                required:
                - data
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-phase: MVP
      x-owner: backend
      x-roles:
      - prospect
      - owner
      - hq
      x-permissions: []
  /regions:
    get:
      operationId: listRegions
      summary: 브랜드의 지역 필터 목록
      tags:
      - 기준정보
      description: 브랜드의 지역 필터 목록
      parameters:
      - &id002
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: page
      - &id003
        name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: page_size
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Region'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  request_id: *id001
                required:
                - data
                - meta
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-phase: MVP
      x-owner: backend
      x-roles:
      - hq
      x-permissions:
      - analytics:read
  /stores:
    get:
      operationId: listStores
      summary: 브랜드의 점포 필터 목록
      tags:
      - 기준정보
      description: 브랜드의 점포 필터 목록
      parameters:
      - name: region_code
        in: query
        required: false
        schema:
          type: string
        description: region_code
      - *id002
      - *id003
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  request_id: *id001
                required:
                - data
                - meta
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-phase: MVP
      x-owner: backend
      x-roles:
      - hq
      x-permissions:
      - analytics:read
  /topics:
    get:
      operationId: listTopics
      summary: 통제된 질문 주제 목록
      tags:
      - 기준정보
      description: 통제된 질문 주제 목록
      parameters:
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Category'
        description: category
      - *id002
      - *id003
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Topic'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  request_id: *id001
                required:
                - data
                - meta
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-phase: MVP
      x-owner: backend
      x-roles:
      - hq
      x-permissions:
      - analytics:read
  /rag-query:
    post:
      operationId: askQuestion
      summary: 점주 문서 질의·근거 답변
      tags:
      - 질문
      description: Gateway가 질문 사건을 먼저 저장하고 권한·판본을 선택한 뒤 내부 RAG 호출. 근거 부족은 200, 시스템 장애는 5xx. source/top_k/사용자 범위
        주입 금지.
      parameters:
      - &id004
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 100
        description: 호출자·operation별 24시간 보존. 재시도는 같은 키, 수정·새 작업은 새 키. 다른 본문은 409.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/RagAnswer'
                  request_id: *id001
                required:
                - data
                - request_id
              example:
                data:
                  question_id: q-demo-001
                  conversation_id: conv-demo-001
                  answer: 등록된 합성 레시피 v1.0 기준으로 바닐라 시럽 20 mL, 전용 펌프 4회입니다.
                  steps:
                  - 전용 펌프 1회는 5 mL입니다.
                  status: answered
                  needs_review: false
                  handoff: false
                  sources:
                  - chunk_id: chunk-vanilla-iced-1.0
                    document_id: demo-cafe-recipes
                    version_id: demo-cafe-recipes-1.0
                    title: 합성 카페 표준 레시피
                    version: '1.0'
                    location: PDF 5쪽 / 바닐라라테 ICED
                    page: 5
                    article: null
                    effective_from: '2026-10-19T00:00:00+09:00'
                    effective_until: null
                    material_type: synthetic
                    is_demo: true
                    excerpt: 바닐라 시럽 20 mL와 에스프레소 60 mL를 별도 용기에서 섞는다.
                    detail_url: /api/v1/documents/demo-cafe-recipes/versions/demo-cafe-recipes-1.0
                    file_url: /api/v1/documents/demo-cafe-recipes/versions/demo-cafe-recipes-1.0/file
                  follow_up_questions: []
                  handoff_reason: null
                  category: recipe
                  topic_id: vanilla_syrup
                  classification_status: classified
                  as_of: '2026-10-23T10:00:00+09:00'
                  basis: current
                  latency_ms: 2100
                request_id: req-rag-001
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          $ref: '#/components/responses/Error502'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      x-phase: MVP
      x-owner: backend
      x-roles:
      - prospect
      - owner
      - hq
      x-permissions:
      - rag:ask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
  /conversations/{conversation_id}:
    get:
      operationId: getConversation
      summary: 본인 대화의 마스킹 기록
      tags:
      - 질문
      description: 본인만 접근. 최대 최근 50문답. 보존기간 만료 시 404. 과거 기록 표시 전 현재 문서 권한 재검사.
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Conversation'
                  request_id: *id001
                required:
                - data
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-phase: MVP
      x-owner: backend
      x-roles:
      - prospect
      - owner
      - hq
      x-permissions: []
  /questions/{question_id}/feedback:
    put:
      operationId: putFeedback
      summary: 본인 답변의 도움 여부 기록
      tags:
      - 질문
      description: 마지막 평가로 교체하는 멱등 PUT. processing/system_error 사건에는 409. 실제 해결 상태를 바꾸지 않음.
      parameters:
      - name: question_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Feedback'
                  request_id: *id001
                required:
                - data
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-phase: MVP
      x-owner: backend
      x-roles:
      - prospect
      - owner
      - hq
      x-permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
  /documents:
    get:
      operationId: listDocuments
      summary: 허용된 문서 계열·대표 판본 목록
      tags:
      - 문서
      description: management=false는 질의 시점에 적용되는 배포 판본. true는 hq document:write 권한으로 초안 포함 최신 등록 판본. 판본 이력은 별도 API.
      parameters:
      - *id002
      - *id003
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Category'
        description: category
      - name: as_of
        in: query
        required: false
        schema: &id008
          type: string
          description: 시간대 필수 RFC3339 시각
          format: date-time
        description: as_of
      - name: management
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: management
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentListItem'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  request_id: *id001
                required:
                - data
                - meta
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-phase: MVP
      x-owner: backend
      x-roles:
      - prospect
      - owner
      - hq
      x-permissions: []
    post:
      operationId: uploadDocument
      summary: 문서 또는 새 판본 등록
      tags:
      - 문서
      description: multipart의 file + metadata JSON 문자열. 같은 계열 새 판본은 metadata.document_id 지정. 원본 바이트를 보존하며 색인은 승인
        이후.
      parameters:
      - *id004
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/DocumentVersion'
                  request_id: *id001
                required:
                - data
                - request_id
              example:
                data:
                  document_id: demo-cafe-recipes
                  version_id: demo-cafe-recipes-1.1
                  brand_id: brand-demo-a
                  title: 합성 카페 표준 레시피
                  version: '1.1'
                  category: recipe
                  material_type: synthetic
                  is_demo: true
                  visibility: owner
                  effective_from: '2026-10-26T00:00:00+09:00'
                  lifecycle: draft
                  index_status: not_started
                  created_at: '2026-10-23T09:00:00+09:00'
                  approved_at: null
                  published_at: null
                  change_summary: 바닐라 시럽 20→15 mL 변경 및 허니자몽블랙티 추가
                  original_source:
                    title: 합성 카페 표준 레시피
                    url: null
                    edition: '1.1'
                    publisher: 프로젝트 팀
                    acquired_on: '2026-10-23'
                    note: 실제 브랜드 제조법이 아닌 합성 데이터
                  indexing_policy:
                    include_pages:
                    - 2
                    - 3
                    - 4
                    - 5
                    - 6
                    - 7
                    - 8
                    - 9
                    exclude_pages:
                    - 1
                    legal_temporal_reviewed: false
                  file_name: 합성_카페_레시피_v1.1.pdf
                  media_type: application/pdf
                  file_size_bytes: 52000
                  sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  page_count: 9
                  file_url: /api/v1/documents/demo-cafe-recipes/versions/demo-cafe-recipes-1.1/file
                  index_revision: null
                request_id: req-upload-001
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
            Location:
              schema:
                type: string
                format: uri-reference
              description: 생성 판본 상세 URL
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      x-phase: MVP
      x-owner: backend
      x-roles:
      - hq
      x-permissions:
      - document:write
      requestBody:
        required: true
        content:
