      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - *id002
      - *id003
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentVersion'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  request_id: *id001
                required:
                - data
                - meta
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
