      - steps
      - status
      - needs_review
      - handoff
      - sources
      - follow_up_questions
      - handoff_reason
      - category
      - topic_id
      - classification_status
      - as_of
      - basis
      - latency_ms
      allOf:
      - if:
          properties:
            status:
              const: answered
          required:
          - status
        then:
          properties:
            needs_review:
              const: false
            handoff:
              const: false
            sources:
              minItems: 1
            handoff_reason:
              type: 'null'
      - if:
          properties:
            status:
              const: needs_review
          required:
          - status
        then:
          properties:
            needs_review:
              const: true
            handoff:
              const: false
          anyOf:
          - properties:
              follow_up_questions:
                minItems: 1
          - properties:
              handoff_reason:
                type: string
                minLength: 1
      - if:
          properties:
            status:
              const: handoff
          required:
          - status
        then:
          properties:
            needs_review:
              const: true
            handoff:
              const: true
            handoff_reason:
              type: string
              minLength: 1
