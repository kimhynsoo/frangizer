openapi: 3.1.0
info:
  title: 가맹파트너 AI 내부 RAG API
  version: 1.0.0
  description: 2026-10-23 개발 계약. 서버 구현 완료를 뜻하지 않는다. 규범적 동작은 API_명세서.md 참조.
servers:
- url: http://rag:8001
  description: 내부 서비스 통신 전용
security:
- ServiceAuth: []
paths:
  /rag-query:
    post:
      operationId: internalAsk
      summary: 허용된 판본에서만 검색·답변
      tags:
      - 내부 RAG
      description: X-Internal-Token AND 원 사용자 Bearer JWT 검증. 본문 principal과 토큰·DB 범위 일치 검사. 검색 전 brand·visibility·명시
        판본·조문 적용일 제한. question_id+attempt_id 중복 호출은 기존 실행/결과 사용.
      parameters: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/InternalAnswer'
                  request_id: &id001
                    type: string
                    description: 서버 발급 불투명 식별자
                    minLength: 1
                    maxLength: 100
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                required:
                - data
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          $ref: '#/components/responses/Error502'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      x-phase: MVP
      x-owner: rag
      x-roles:
      - service
      x-permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalQuery'
      security:
      - ServiceAuth: []
        BearerAuth: []
  /internal/v1/index-jobs:
    post:
      operationId: startInternalIndexJob
      summary: 승인된 문서 판본의 색인 준비
      tags:
      - 내부 색인
      description: job_id가 중복 키. 같은 job_id+내용이면 기존 작업, 다른 내용이면409. 사용자 토큰 불필요. 승인 확인은 Gateway 책임. 인덱스 생성은 배포가 아님.
      parameters: []
      responses:
        '202':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/IndexJob'
                  request_id: *id001
                required:
                - data
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-phase: MVP
      x-owner: rag
      x-roles:
      - service
      x-permissions: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexJobRequest'
  /internal/v1/index-jobs/{job_id}:
    get:
      operationId: getInternalIndexJob
      summary: 내부 색인 작업 조회
      tags:
      - 내부 색인
      description: 내부 색인 작업 조회
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/IndexJob'
                  request_id: *id001
                required:
                - data
                - request_id
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-phase: MVP
      x-owner: rag
      x-roles:
      - service
      x-permissions: []
  /health:
    get:
      operationId: internalHealth
      summary: RAG 서비스 준비 상태
      tags:
      - 내부 상태
      description: RAG 서비스 준비 상태
      parameters: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: 서버 추적 ID
        '401':
          $ref: '#/components/responses/Error401'
        '503':
          description: 미준비
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: not_ready
      x-phase: MVP
      x-owner: rag
      x-roles:
      - service
      x-permissions: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ServiceAuth:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Gateway/worker 서버 전용 비밀. 브라우저 전달 금지.
  schemas:
    Id: &id003
      type: string
      description: 서버 발급 불투명 식별자
      minLength: 1
      maxLength: 100
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    Timestamp: &id005
      type: string
      description: 시간대 필수 RFC3339 시각
      format: date-time
    Role:
      type: string
      enum:
      - prospect
      - owner
      - hq
    Category:
      type: string
      enum:
      - franchise
      - recipe
      - hygiene
      - consumer
      - other
    AnswerStatus:
      type: string
      enum:
      - answered
      - needs_review
      - handoff
    EventAnswerStatus:
      type: string
      enum:
      - processing
      - answered
      - needs_review
      - handoff
      - system_error
    ResolutionStatus:
      type: string
      enum:
      - unknown
      - open
      - in_progress
      - closed
    ClassificationStatus:
      type: string
      enum:
      - pending
      - classified
      - failed
      - corrected
    MaterialType:
      type: string
      enum:
      - official
      - public_disclosure
      - synthetic
    Lifecycle:
      type: string
      enum:
      - draft
      - approved
      - published
    IndexStatus:
      type: string
      enum:
      - not_started
      - queued
      - running
      - ready
      - failed
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - field
      - code
      - message
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            question_id:
              anyOf:
              - $ref: '#/components/schemas/Id'
              - type: 'null'
            retryable: &id004
              type: boolean
          required:
          - code
          - message
          - details
          - question_id
          - retryable
        request_id:
          $ref: '#/components/schemas/Id'
      required:
      - error
      - request_id
    PageMeta:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total: &id002
          type: integer
          minimum: 0
        total_pages: *id002
      required:
      - page
      - page_size
      - total
      - total_pages
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id003
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        brand_id: *id003
        store_id:
          anyOf:
          - *id003
          - type: 'null'
        region_code:
          anyOf:
          - type: string
          - type: 'null'
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
      required:
      - id
      - username
      - role
      - brand_id
      - store_id
      - region_code
      - permissions
    Region:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
    Store:
      type: object
      additionalProperties: false
      properties:
        id: *id003
        name:
          type: string
        region_code:
          type: string
        active: *id004
      required:
      - id
      - name
      - region_code
      - active
    Topic:
      type: object
      additionalProperties: false
      properties:
        id: *id003
        label:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        active: *id004
      required:
      - id
      - label
      - category
      - active
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
      required:
      - username
      - password
    LoginResponse:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/User'
        request_id: *id003
      required:
      - accessToken
      - token_type
      - expires_in
      - user
      - request_id
    AskRequest:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          description: trim 후 1~2000자. 범위·권한·source·top_k는 받지 않는다.
          minLength: 1
          maxLength: 2000
          pattern: \S
        conversation_id:
          anyOf:
          - *id003
          - type: 'null'
        as_of:
          anyOf:
          - *id005
          - type: 'null'
      required:
      - question
    Source:
      type: object
      additionalProperties: false
      properties:
        chunk_id: *id003
        document_id: *id003
        version_id: *id003
        title:
          type: string
        version:
          type: string
        location:
          type: string
        page:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        article:
          anyOf:
          - type: string
          - type: 'null'
        effective_from: *id005
        effective_until:
          anyOf:
          - *id005
          - type: 'null'
        material_type:
          $ref: '#/components/schemas/MaterialType'
        is_demo: *id004
        excerpt:
          type: string
          maxLength: 1500
        detail_url:
          type: string
          format: uri-reference
        file_url:
          type: string
          format: uri-reference
      required:
      - chunk_id
      - document_id
      - version_id
      - title
      - version
      - location
      - page
      - article
      - effective_from
      - effective_until
      - material_type
      - is_demo
      - excerpt
      - detail_url
      - file_url
    RagAnswer:
      type: object
      additionalProperties: false
      properties:
        question_id: *id003
        conversation_id: *id003
        answer:
          type: string
          minLength: 1
        steps:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/AnswerStatus'
        needs_review: *id004
        handoff: *id004
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        follow_up_questions:
          type: array
          items:
            type: string
        handoff_reason:
          anyOf:
          - type: string
          - type: 'null'
        category:
          $ref: '#/components/schemas/Category'
        topic_id:
          anyOf:
          - *id003
          - type: 'null'
        classification_status:
          $ref: '#/components/schemas/ClassificationStatus'
        as_of: *id005
        basis:
          type: string
          enum:
          - past
          - current
          - future
        latency_ms: *id002
      required:
      - question_id
      - conversation_id
      - answer
      - steps
      - status
      - needs_review
      - handoff
      - sources
      - follow_up_questions
      - handoff_reason
      - category
      - topic_id
      - classification_status
      - as_of
      - basis
      - latency_ms
      allOf:
      - if:
          properties:
            status:
              const: answered
          required:
          - status
        then:
          properties:
            needs_review:
              const: false
            handoff:
              const: false
            sources:
              minItems: 1
            handoff_reason:
              type: 'null'
      - if:
          properties:
            status:
              const: needs_review
          required:
          - status
        then:
          properties:
            needs_review:
              const: true
            handoff:
              const: false
          anyOf:
          - properties:
              follow_up_questions:
                minItems: 1
          - properties:
              handoff_reason:
                type: string
                minLength: 1
      - if:
          properties:
            status:
              const: handoff
          required:
          - status
        then:
          properties:
            needs_review:
              const: true
            handoff:
              const: true
            handoff_reason:
              type: string
              minLength: 1
    Conversation:
      type: object
      additionalProperties: false
      properties:
        id: *id003
        created_at: *id005
        updated_at: *id005
        messages:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              question_id: *id003
              question_redacted:
                type: string
              created_at: *id005
              answer_status:
                $ref: '#/components/schemas/EventAnswerStatus'
              result:
                anyOf:
                - $ref: '#/components/schemas/RagAnswer'
                - type: 'null'
              error_code:
                anyOf:
                - type: string
                - type: 'null'
            required:
            - question_id
            - question_redacted
            - created_at
            - answer_status
            - result
            - error_code
      required:
      - id
      - created_at
      - updated_at
      - messages
    OriginalSource:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        url:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        edition:
          type: string
          minLength: 1
          maxLength: 100
        publisher:
          type: string
          minLength: 1
          maxLength: 100
        acquired_on:
          type: string
          format: date
        note:
          type: string
          maxLength: 2000
      required:
      - title
      - url
      - edition
      - publisher
      - acquired_on
      - note
    IndexingPolicy:
      type: object
      additionalProperties: false
      properties:
        include_pages:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          uniqueItems: true
        exclude_pages:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
        legal_temporal_reviewed: *id004
      required:
      - exclude_pages
      - legal_temporal_reviewed
    DocumentVersion:
      type: object
      additionalProperties: false
      properties:
        document_id: *id003
        version_id: *id003
        brand_id: *id003
        title:
          type: string
        version:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        material_type:
          $ref: '#/components/schemas/MaterialType'
        is_demo: *id004
        visibility:
          $ref: '#/components/schemas/Role'
        effective_from: *id005
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
        index_status:
          $ref: '#/components/schemas/IndexStatus'
        created_at: *id005
        approved_at:
          anyOf:
          - *id005
          - type: 'null'
        published_at:
          anyOf:
          - *id005
          - type: 'null'
        change_summary:
          type: string
        original_source:
          $ref: '#/components/schemas/OriginalSource'
        indexing_policy:
          $ref: '#/components/schemas/IndexingPolicy'
        file_name:
          type: string
        media_type:
          type: string
        file_size_bytes: *id002
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        page_count:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        file_url:
          type: string
          format: uri-reference
        index_revision:
          anyOf:
          - *id003
          - type: 'null'
      required:
      - document_id
      - version_id
      - brand_id
      - title
      - version
      - category
      - material_type
      - is_demo
      - visibility
      - effective_from
      - lifecycle
      - index_status
      - created_at
      - approved_at
      - published_at
      - change_summary
      - original_source
      - indexing_policy
      - file_name
      - media_type
      - file_size_bytes
      - sha256
      - page_count
      - file_url
      - index_revision
    DocumentListItem:
      type: object
      additionalProperties: false
      properties:
        document_id: *id003
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        material_type:
          $ref: '#/components/schemas/MaterialType'
        is_demo: *id004
        visibility:
          $ref: '#/components/schemas/Role'
        selected_version_id:
          anyOf:
          - *id003
          - type: 'null'
        selected_version:
          anyOf:
          - type: string
          - type: 'null'
        effective_from:
          anyOf:
          - *id005
          - type: 'null'
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
        index_status:
          $ref: '#/components/schemas/IndexStatus'
      required:
      - document_id
      - title
      - category
      - material_type
      - is_demo
      - visibility
      - selected_version_id
      - selected_version
      - effective_from
      - lifecycle
      - index_status
    Section:
      type: object
      additionalProperties: false
      properties:
        chunk_id: *id003
        page:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        article:
          anyOf:
          - type: string
          - type: 'null'
        heading:
          type: string
        text:
          type: string
        effective_from: *id005
        effective_until:
          anyOf:
          - *id005
          - type: 'null'
      required:
      - chunk_id
      - page
      - article
      - heading
      - text
      - effective_from
      - effective_until
    DocumentDetail:
      type: object
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/DocumentVersion'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
        sections_meta:
          $ref: '#/components/schemas/PageMeta'
      required:
      - version
      - sections
      - sections_meta
    UploadMetadata:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          minLength: 1
          maxLength: 50
        document_id: *id003
        category:
          $ref: '#/components/schemas/Category'
        material_type:
          $ref: '#/components/schemas/MaterialType'
        is_demo: *id004
        visibility:
          $ref: '#/components/schemas/Role'
        effective_from: *id005
        original_source:
          $ref: '#/components/schemas/OriginalSource'
        change_summary:
          type: string
          minLength: 1
          maxLength: 2000
        indexing_policy:
          $ref: '#/components/schemas/IndexingPolicy'
      required:
      - title
      - version
      - category
      - material_type
      - is_demo
      - visibility
      - effective_from
      - original_source
      - change_summary
      - indexing_policy
    UploadRequest:
      type: object
      additionalProperties: false
      properties:
        file:
          type: string
          description: PDF/TXT/MD; 10 MiB 이하. 실제 파일 바이트는 서버에서 검사한다.
          format: binary
        metadata:
          type: string
          description: UploadMetadata JSON 문자열. encoding의 contentType도 application/json으로 지정한다.
      required:
      - file
      - metadata
    ApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        review_note:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - review_note
    Approval:
      type: object
      additionalProperties: false
      properties:
        document_id: *id003
        version_id: *id003
        lifecycle:
          type: string
          enum:
          - approved
        index_status:
          type: string
          enum:
          - queued
          - running
        job_id: *id003
      required:
      - document_id
      - version_id
      - lifecycle
      - index_status
      - job_id
    IndexJob:
      type: object
      additionalProperties: false
      properties:
        job_id: *id003
        document_id: *id003
        version_id: *id003
        status:
          $ref: '#/components/schemas/JobStatus'
        chunk_count: *id002
        index_revision:
          anyOf:
          - *id003
          - type: 'null'
        error_code:
          anyOf:
          - type: string
          - type: 'null'
        error_message:
          anyOf:
          - type: string
          - type: 'null'
        created_at: *id005
        updated_at: *id005
      required:
      - job_id
      - document_id
      - version_id
      - status
      - chunk_count
      - index_revision
      - error_code
      - error_message
