# docker compose up -d --build        → db + backend + rag + web
# Optional speech service:  docker compose --profile voice up -d --build
#
# Services call each other by service name (db, backend, rag, voice), never localhost.
# Only the web (nginx) port is published. For local debugging add docker-compose.dev.yml.
# Required values must be set in .env; compose stops with a message if one is empty.

services:
  db:
    image: mariadb:11
    environment:
      # App user owns the database (Flyway creates the schema). Root password is random and unused.
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: ${DB_NAME:-frangizer}
      MARIADB_USER: ${DB_USERNAME:-frangizer}
      MARIADB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD 값을 넣으세요}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      # Root context: the build also copies docs/api/public.openapi.yaml for Swagger (/swagger.html)
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Names follow backend/src/main/resources/application.yml
      DB_URL: jdbc:mariadb://db:3306/${DB_NAME:-frangizer}
      DB_USERNAME: ${DB_USERNAME:-frangizer}
      DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD 값을 넣으세요}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET (32바이트 이상) 값을 넣으세요}
      JWT_ISSUER: ${JWT_ISSUER:-frangizer}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-frangizer-api}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?.env에 INTERNAL_TOKEN 값을 넣으세요}
      RAG_URL: http://rag:8001
      VOICE_URL: http://voice:8008   # optional profile; /stt returns 503 when voice is not running
      DOCUMENT_STORE_DIR: /var/lib/frangizer
      DEMO_PASSWORD: ${DEMO_PASSWORD:?.env에 DEMO_PASSWORD 값을 넣으세요}
      # Same origin through nginx, so no CORS origins are needed in the deployed stack
      CORS_ALLOWED_ORIGINS: ""
    volumes:
      - frangizer_data:/var/lib/frangizer   # shared with rag: uploaded documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  rag:
    build:
      context: ./rag
    environment:
      # Names follow rag/.env.example
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?.env에 INTERNAL_TOKEN 값을 넣으세요}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET (32바이트 이상) 값을 넣으세요}
      JWT_ISSUER: ${JWT_ISSUER:-frangizer}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-frangizer-api}
      JWT_ALGORITHM: HS256
      # Without these the service still starts: questions return 503 and indexing fails with EMBEDDING_NOT_CONFIGURED
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      DOCUMENT_STORE_DIR: /var/lib/frangizer
      FAISS_DIR: /var/lib/frangizer/faiss
      RAG_STATE_DB: /var/lib/frangizer/rag/query-results.sqlite3
      RECIPE_STRUCTURED_FILE: /app/data/structured/demo_cafe_recipes.json
      TABLE_REVIEW_FILE: /app/data/structured/table_reviews.json
    volumes:
      - frangizer_data:/var/lib/frangizer   # shared with backend: documents, FAISS revisions, query results
      # Documents reach RAG only through backend upload → approve. Raw data/source, data/staged,
      # eval and docs are never mounted (folder rule 4.3). Structured recipes are read-only input.
      - ./data/structured:/app/data/structured:ro
    healthcheck:
      # /health needs the service token and returns 503 until models and a first index exist.
      # The container counts as healthy once the server answers 200 or 503.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.error, urllib.request
          req = urllib.request.Request("http://localhost:8001/health", headers={"X-Internal-Token": os.environ["INTERNAL_TOKEN"]})
          try:
              urllib.request.urlopen(req, timeout=3)
          except urllib.error.HTTPError as e:
              raise SystemExit(0 if e.code == 503 else 1)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  voice:
    profiles: ["voice"]
    build:
      context: ./voice
    environment:
      # Only the Java gateway calls voice (it already checked the user's JWT)
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?.env에 INTERNAL_TOKEN 값을 넣으세요}
    volumes:
      - whisper_cache:/root/.cache/huggingface
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      rag:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  frangizer_data:
  whisper_cache:
