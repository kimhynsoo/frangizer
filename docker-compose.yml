# docker compose up -d --build
# Services call each other by service name (db, backend, rag, voice), never localhost.
# Only the web (nginx) port is published. For local debugging add docker-compose.dev.yml.
#
# Requires: backend/Dockerfile (C), rag/Dockerfile (A,B), frontend/package.json (D).
# Optional speech service: docker compose --profile voice up -d

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-frangizer}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/${DB_NAME:-frangizer}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      RAG_BASE_URL: http://rag:8001
      VOICE_BASE_URL: http://voice:8008
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  rag:
    build:
      context: ./rag
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      FAISS_DIR: ${FAISS_DIR:-/var/lib/frangizer/faiss}
      DOCUMENT_STORE_DIR: ${DOCUMENT_STORE_DIR:-/var/lib/frangizer/documents}
    volumes:
      - rag_data:/var/lib/frangizer
      # Only data/source is indexable. Never mount data/staged, eval or docs (folder rule 4.3).
      - ./data/source:/app/data/source:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  voice:
    profiles: ["voice"]
    build:
      context: ./voice
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    volumes:
      - whisper_cache:/root/.cache/huggingface
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  rag_data:
  whisper_cache:
